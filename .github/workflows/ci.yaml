name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_ACCOUNT_ID: ${{ secrets.BATON_ACCOUNT_ID }}
      BATON_ZOOM_CLIENT_ID: ${{ secrets.BATON_ZOOM_CLIENT_ID }}
      BATON_ZOOM_CLIENT_SECRET: ${{ secrets.BATON_ZOOM_CLIENT_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-zoom
        run: go build ./cmd/baton-zoom
      - name: Grant/Revoke group membership
        if: vars.TEST_GROUP_ID != '' && vars.TEST_PRINCIPAL != '' && vars.TEST_PRINCIPAL_TYPE != ''
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-zoom
          baton-entitlement: group:${{ vars.TEST_GROUP_ID }}:member
          baton-principal: ${{ vars.TEST_PRINCIPAL }}
          baton-principal-type: ${{ vars.TEST_PRINCIPAL_TYPE }}
          required-secrets: BATON_ACCOUNT_ID,BATON_ZOOM_CLIENT_ID,BATON_ZOOM_CLIENT_SECRET
      - name: Grant/Revoke role membership
        if: vars.TEST_ROLE_ENTITLEMENT != '' && vars.TEST_ROLE_PRINCIPAL != '' && vars.TEST_ROLE_PRINCIPAL_TYPE != ''
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-zoom
          baton-entitlement: ${{ vars.TEST_ROLE_ENTITLEMENT }}
          baton-principal: ${{ vars.TEST_ROLE_PRINCIPAL }}
          baton-principal-type: ${{ vars.TEST_ROLE_PRINCIPAL_TYPE }}
          required-secrets: BATON_ACCOUNT_ID,BATON_ZOOM_CLIENT_ID,BATON_ZOOM_CLIENT_SECRET
