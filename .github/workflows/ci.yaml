name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_ACCOUNT_ID: ${{ secrets.BATON_ACCOUNT_ID }}
      BATON_ZOOM_CLIENT_ID: ${{ secrets.BATON_ZOOM_CLIENT_ID }}
      BATON_ZOOM_CLIENT_SECRET: ${{ secrets.BATON_ZOOM_CLIENT_SECRET }}
      TEST_LICENSE_ENTITLEMENT: ${{ vars.TEST_LICENSE_ENTITLEMENT }}
      TEST_LICENSE_PRINCIPAL: ${{ vars.TEST_LICENSE_PRINCIPAL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-zoom
        run: go build ./cmd/baton-zoom
      - name: Grant/Revoke group membership
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-zoom
          baton-entitlement: group:${{ vars.TEST_GROUP_ID }}:member
          baton-principal: ${{ vars.TEST_PRINCIPAL }}
          baton-principal-type: ${{ vars.TEST_PRINCIPAL_TYPE }}
          required-secrets: BATON_ACCOUNT_ID,BATON_ZOOM_CLIENT_ID,BATON_ZOOM_CLIENT_SECRET
      - name: Grant/Revoke role membership
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-zoom
          baton-entitlement: ${{ vars.TEST_ROLE_ENTITLEMENT }}
          baton-principal: ${{ vars.TEST_ROLE_PRINCIPAL }}
          baton-principal-type: ${{ vars.TEST_ROLE_PRINCIPAL_TYPE }}
          required-secrets: BATON_ACCOUNT_ID,BATON_ZOOM_CLIENT_ID,BATON_ZOOM_CLIENT_SECRET
      - name: Install baton
        uses: ConductorOne/github-workflows/actions/get-baton@v4
      - name: Sync and verify license data
        run: |
          for name in BATON_ACCOUNT_ID BATON_ZOOM_CLIENT_ID BATON_ZOOM_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::notice title=license test skipped::required secret $name is empty"
              exit 0
            fi
          done

          ./baton-zoom

          license_id="${TEST_LICENSE_ENTITLEMENT#license:}"
          license_id="${license_id%:assigned}"
          baton resources --output-format=json | jq --exit-status --arg license_id "$license_id" \
            '[.resources[]? | select(.resource.id.resourceType == "license" and .resource.id.resource == $license_id)] | length == 1'
          baton entitlements --output-format=json | jq --exit-status --arg entitlement "$TEST_LICENSE_ENTITLEMENT" \
            '[.entitlements[]? | select(.entitlement.id == $entitlement)] | length == 1'
          baton grants --entitlement="$TEST_LICENSE_ENTITLEMENT" --output-format=json | jq --exit-status --arg principal "$TEST_LICENSE_PRINCIPAL" \
            '[.grants[]? | select(.principal.id.resource == $principal)] | length == 1'
